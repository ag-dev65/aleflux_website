<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AFELUX Worker Registration</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f6f9;
      padding: 20px;
    }
    .form-container {
      max-width: 450px;
      background: white;
      padding: 20px;
      margin: auto;
      border-radius: 8px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      background: #0077b6;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background: #023e8a;
    }
  </style>
</head>
<body>
 <!-- Form Section -->
  <section class="form-section">
    <h2>Submit Your Details</h2>
    <form>
      <div class="form-group">
        <label for="idcard">Upload ID Card</label>
        <input type="file" id="idcard" name="idcard" accept="image/*" required />
      </div>

      <div class="form-group">
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required />
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required />
      </div>

      <button type="submit">Submit</button>
    </form>
  </section>

  <script>
    document.getElementById("registrationForm").addEventListener("submit", function(event) {
      event.preventDefault();

      const url = "https://docs.google.com/spreadsheets/d/1Vfd2noSaxcKzR3DJBs_V6BEyjednUcHEfoI6ymDVvgw/edit?gid=0#gid=0";
      const formData = new FormData();
      formData.append("name", document.getElementById("name").value);
      formData.append("phone", document.getElementById("phone").value);
      formData.append("idcard", document.getElementById("idcard").value);

      fetch(url, { method: "POST", body: formData })
        .then(response => response.text())
        .then(data => {
          document.getElementById("response").textContent = "Submitted successfully!";
        })
        .catch(error => {
          document.getElementById("response").textContent = "Submission failed. Try again.";
        });
    });
  </script>
</body>
</html>
